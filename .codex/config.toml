[features]
multi_agent = true

[agents]
enabled = true
max_concurrent_threads_per_session = 3
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "low"

[mcp_servers.qtDocumentation]
url = "https://qt-docs-mcp.qt.io/mcp"

[mcp_servers.qtCreator]
command = "node"
args = [".codex/qt_creator_mcp_bridge.mjs", "http://127.0.0.1:45678/"]
