[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "droplet-trainer"
dynamic = ["version"]
description = "External Python trainer backend for OpenDSS."
requires-python = ">=3.10,<3.13"
readme = "README-windows-training.md"
license = {text = "Apache-2.0"}
dependencies = [
  "torch",
  "torchvision",
  "numpy",
  "pillow",
  "scikit-learn",
  "pandas",
  "onnx",
  "onnxscript",
]

[project.optional-dependencies]
onnx-cpu = ["onnxruntime==1.25.1"]
onnx-gpu = ["onnxruntime-gpu==1.25.1"]

[project.scripts]
droplet-trainer = "droplet_trainer.cli:main"

[tool.setuptools]
packages = ["droplet_trainer"]

[tool.setuptools.dynamic]
version = {attr = "droplet_trainer.__version__"}
