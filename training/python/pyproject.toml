[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "droplet-trainer"
version = "0.2.0"
description = "External Python trainer backend for OpenDSS."
requires-python = ">=3.10,<3.13"
readme = "README-windows-training.md"
license = {text = "Apache-2.0"}
dependencies = [
  "torch",
  "torchvision",
  "numpy",
  "pillow",
  "scikit-learn",
  "pandas",
  "onnx",
  "onnxruntime",
  "onnxscript",
]

[project.scripts]
droplet-trainer = "droplet_trainer.cli:main"

[tool.setuptools.packages.find]
include = ["droplet_trainer*"]
